kind = "web"
previewPath = "/"
title = "ShootMate AI"
description = "A mobile-friendly photography planning app for photographers and content creators, with an AI-style chat, customizable shoot checklists, tailored shot lists, and practical shoot-day schedules."
version = "1.0.0"
id = "artifacts/shootmate-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19594

[services.development]
run = "pnpm --filter @workspace/shootmate-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shootmate-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/shootmate-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19594"
BASE_PATH = "/"
